# cmx-rpt-server 实际配置（独立报表平台微服务模式）。
#
# 加载顺序：本文件（路径由 CONFIG_FILE 指定，或默认 ./report-server.toml）→ 环境变量覆盖。
# 环境变量优先级最高（[server] 框架键覆盖 SERVER__*，与 ConfigManager `__` 约定同名；业务键见各段注释）。
#
# 数据源走标准 [[databases]] 段（BaseConfig 直读）；认证走 [auth] 段（ConfigManager 直读）。

# —— chassis 框架级（[server] 段，与门户 dev.toml 统一形态；旧顶层散字段已废弃不生效）——
[server]
host = "0.0.0.0"
port = 8092
log_dir = "logs"
log_level = "info"
graceful_timeout_secs = 10

# —— 数据源（标准 [[databases]] 段；BaseConfig 直读，db_id 固定 = RPT_DB_ID = "fico-db"）——
# 报表数据字典物理表 cr_*（版式/单元格/浮动/来源绑定）全在 fico 库；缺段启动失败（无 URL 兜底）。
[[databases]]
db_id = "fico-db"
db_name = "报表平台库"
db_type = "postgres"
db_url = "postgres://dbuser_dba:9lWsRQY4i4VToPpkHcCRFzki@192.168.1.14:5432/cmx_fico"
#db_url = "postgres://postgres:postgres@192.168.1.100:5433/fico"
default = true

# —— 认证（与 flow-server-dev 同款；平台/onto 经 report proxy 转发时注入 X-API-Key + 委托令牌）——
# report API 鉴权门（cmx-rpt-app::auth_middleware，收编 cmx-engine-kit::auth::jwt）。缺本段→中间件按默认放行。
[auth]
mode = "jwt"                # 生产务必 jwt（off 模式租户取 X-Tenant 头，越权隐患）
jwt_alg = "HS256"
jwt_secret = "a7k9m2p4x8q1w5e3r6t0y7u2i9o4p1"   # 须 = 平台签发 JWT 的密钥
jwt_tenant_claim = "tenant"
jwt_roles_claim = "roles"
# 服务间 API Key（命中即免 JWT，key:回退租户）——须 = 平台 [service_auth].outgoing_api_key。
api_keys = "cmx_sk_dev_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6:default"

# —— 页面资产（[assets] 段：引擎自持 native/html 页面投递目录；env 覆盖 ASSETS__UI_NATIVE_DIR/ASSETS__UI_HTML_DIR）——
[assets]
ui_native_dir = "../cmx-container/assets/report/web/ui-native"
ui_html_dir = "../cmx-container/assets/report/web/ui-html"

# ==================== 关账流程对接 ====================
# （经 cmx-flow-sdk + 服务目录；flow 键未配 = 关账退化为服务内顺序编排，不起实例）
[service_rpc]
default_transport = "http"
nacos_group = "DEFAULT_GROUP"
timeout_ms = 30000
retry_max = 1

[service_rpc.services]
flow = { url = "http://127.0.0.1:8091", discovery = "cmx-flow-server" }

# 关账流程参数（原 FLOW_CLOSE_DEF_KEY / FLOW_USER 环境变量迁入）
[consol.flow]
definition_key = "consol_close"   # 关账流程定义 key
initiator = "consol-close"        # 发起人身份（进 variables.initiator；旧 X-User 头在 flow jwt 模式下本就不生效）
