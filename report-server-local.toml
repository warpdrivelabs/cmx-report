# cmx-rpt-server 本地联调配置（onto↔report 跨服务：生成报表副作用）。
# 用法：CONFIG_FILE=report-server-local.toml cargo run -p cmx-rpt-server
# 指向与 onto/flow 同一团队开发库 192.168.157.46/cmx_fico（cr_* 与 om_*/cmx_flow_* 前缀不冲突）。
[server]
host = "0.0.0.0"
port = 8092
log_dir = "logs"
log_level = "info"
graceful_timeout_secs = 10

[[databases]]
db_id = "fico-db"
db_name = "报表平台库"
db_type = "postgres"
db_url = "postgres://dbuser_dba:9lWsRQY4i4VToPpkHcCRFzki@192.168.157.46:5432/cmx_fico"
default = true

# 认证：与 flow 同款 jwt + 服务 API Key（命中即免 JWT）。onto dispatcher 以 ONTO_REPORT_API_KEY 注入同一 X-API-Key。
[auth]
mode = "jwt"
jwt_alg = "HS256"
jwt_secret = "a7k9m2p4x8q1w5e3r6t0y7u2i9o4p1"
jwt_tenant_claim = "tenant"
jwt_roles_claim = "roles"
api_keys = "cmx_sk_dev_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6:default"

[assets]
ui_native_dir = "../cmx-container/assets/report/web/ui-native"
ui_html_dir = "../cmx-container/assets/report/web/ui-html"
