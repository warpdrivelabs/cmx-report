<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MEGA Report · 报表平台微服务</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#111834; --card:#151d3a; --line:#243056; --fg:#e8ecff; --mut:#8b96c4;
    --accent:#3aa0ff; --accent2:#00e6b8; --grad1:#2a6bff; --grad2:#00e6b8; --shadow:rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#eef2fb; --bg2:#ffffff; --card:#ffffff; --line:#dde5f5; --fg:#16203a; --mut:#5a6689;
    --accent:#1d74e0; --accent2:#00b892; --grad1:#1d74e0; --grad2:#00b892; --shadow:rgba(40,60,110,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,var(--bg2),var(--bg)) fixed;color:var(--fg);min-height:100vh}
  .wrap{max-width:1160px;margin:0 auto;padding:28px 22px 48px}
  header{display:flex;align-items:center;gap:16px;margin-bottom:22px}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--grad1),var(--grad2));
    display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 6px 20px var(--shadow);position:relative;overflow:hidden}
  .logo::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);
    transform:translateX(-100%);animation:scan 3.2s linear infinite}
  @keyframes scan{to{transform:translateX(100%)}}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  .sub{color:var(--mut);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .pill{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:12px;display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 var(--accent2);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,184,.5)}70%{box-shadow:0 0 0 8px rgba(0,230,184,0)}100%{box-shadow:0 0 0 0 rgba(0,230,184,0)}}
  button.toggle{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 8px 24px var(--shadow);position:relative;overflow:hidden}
  .kpi .cap{color:var(--mut);font-size:12.5px}
  .kpi .num{font-size:38px;font-weight:800;margin-top:6px;background:linear-gradient(135deg,var(--grad1),var(--grad2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .kpi .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--grad1),var(--grad2))}
  .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
  @media(max-width:820px){.kpis{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px var(--shadow)}
  .panel h2{font-size:14px;margin:0 0 12px;color:var(--fg);display:flex;align-items:center;gap:8px}
  .panel h2 .tag{font-size:11px;color:var(--mut);font-weight:500}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
  .row:first-of-type{border-top:none}
  .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .code{color:var(--mut);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .count{min-width:34px;text-align:right;font-weight:700;color:var(--accent)}
  .track{flex:1;height:8px;border-radius:6px;background:var(--line);overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--grad1),var(--grad2));border-radius:6px;width:0;transition:width .6s ease}
  .empty{color:var(--mut);padding:14px 0;text-align:center;font-size:13px}
  footer{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">R</div>
    <div>
      <h1>MEGA Report</h1>
      <div class="sub">报表平台微服务 · cmx-rpt-server · <span id="dbid">fico-db</span></div>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot"></span><span id="status">实时</span></div>
    <button class="toggle" onclick="toggleTheme()">◑ 主题</button>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="cap">报表总数</div><div class="num" id="k-reports">–</div><div class="bar"></div></div>
    <div class="kpi"><div class="cap">报表分类</div><div class="num" id="k-cats">–</div><div class="bar"></div></div>
    <div class="kpi"><div class="cap">期间类型</div><div class="num" id="k-periods">–</div><div class="bar"></div></div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>分类分布 <span class="tag">每类报表数</span></h2>
      <div id="cats"><div class="empty">加载中…</div></div>
    </div>
    <div class="panel">
      <h2>报表清单 <span class="tag">最近</span></h2>
      <div id="reports"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <footer>每 5 秒刷新 · 数据源 fico-db · GET /api/rpt/stats</footer>
</div>

<script>
  function toggleTheme(){
    const h=document.documentElement;
    h.dataset.theme = h.dataset.theme==='dark' ? 'light' : 'dark';
    try{localStorage.setItem('rpt-theme',h.dataset.theme)}catch(e){}
  }
  (function(){try{const t=localStorage.getItem('rpt-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}})();

  const pick=(o,keys,d)=>{for(const k of keys){if(o&&o[k]!=null&&o[k]!=='')return o[k]}return d};
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function catOf(r){return pick(r,['category','categoryCode','category_code','cat'],'');}
  function nameOf(o){return pick(o,['name','reportName','title','label'],pick(o,['code','id'],'—'));}
  function codeOf(o){return pick(o,['code','id','reportCode'],'');}

  function render(d){
    document.getElementById('dbid').textContent = d.dbId || 'fico-db';
    const k=d.kpi||{};
    document.getElementById('k-reports').textContent = k.reports??0;
    document.getElementById('k-cats').textContent = k.categories??0;
    document.getElementById('k-periods').textContent = k.periods??0;

    const cats=d.categories||[], reports=d.reports||[];
    // 每类报表数（客户端按 report.category === category.code 归并；无匹配则计未分类）。
    const counts={}; reports.forEach(r=>{const c=catOf(r)||'__none';counts[c]=(counts[c]||0)+1});
    const max=Math.max(1,...cats.map(c=>counts[codeOf(c)]||0));
    const catsEl=document.getElementById('cats');
    if(!cats.length){catsEl.innerHTML='<div class="empty">暂无分类</div>';}
    else{
      catsEl.innerHTML=cats.slice(0,10).map(c=>{
        const n=counts[codeOf(c)]||0, w=Math.round(n/max*100);
        return `<div class="row"><div class="name">${esc(nameOf(c))} <span class="code">${esc(codeOf(c))}</span></div>
          <div class="track"><div class="fill" style="width:${w}%"></div></div><div class="count">${n}</div></div>`;
      }).join('');
    }

    const repEl=document.getElementById('reports');
    if(!reports.length){repEl.innerHTML='<div class="empty">暂无报表</div>';}
    else{
      repEl.innerHTML=reports.slice(0,12).map(r=>
        `<div class="row"><div class="name">${esc(nameOf(r))}</div><div class="code">${esc(codeOf(r))}</div></div>`
      ).join('');
    }
  }

  async function poll(){
    const st=document.getElementById('status');
    try{
      const res=await fetch('/api/rpt/stats',{headers:{'Accept':'application/json'}});
      const body=await res.json();
      render(body.data||body||{});
      st.textContent='实时';
    }catch(e){ st.textContent='连接中断'; }
  }
  poll(); setInterval(poll,5000);
</script>
</body>
</html>
